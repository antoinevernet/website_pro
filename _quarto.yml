project:
  type: website

  preview: 
      port: 5555
      browser: true
      watch-inputs: true
      navigate: true

  render:
      - "*.qmd"
      - "!CLAUDE.md"

  resources:
      - "files/**"
      - "blog/2025/11/revealjs_slides/slides"
      - "llms.txt"
      - "favicon.ico"

# Metadata stuff
author-meta: "Antoine Vernet"


# Favicon fallbacks (favicon.svg is set under website:). Top-level so it also
# applies to live-html pages.
include-in-header:
  - text: |
      <link rel="icon" href="/favicon.ico" sizes="48x48">
      <link rel="apple-touch-icon" href="/files/apple-touch-icon.png">

execute:
  freeze: auto


website:
  title: "Antoine Vernet"
  description: "Antoine Vernet is an associate professor at the Bartlett School of Sustainable Construction at UCL, researching organizational design and social networks."
  favicon: "files/favicon.svg"
  site-url: "https://antoinevernet.com"
  repo-url: "https://github.com/antoinevernet/website_pro"

  google-analytics: "G-FR1LQ5LD0Y"


  twitter-card: 
    image: "/files/social-card.jpg"
    card-style: summary_large_image
    creator: "@antoine__V"
    site: "@antoinevernet"

  open-graph: 
    image: "/files/social-card.jpg"
    locale: en_UK
  

  navbar:
    pinned: true

    left:
      - href: index.qmd
        text: About
      - href: cv/index.qmd
        text: CV
      - href: research/index.qmd
        text: Research
      - href: teaching/index.qmd
        text: Teaching
      - text: Talks
        href: talks/index.qmd
      - href: blog/index.qmd
        text: Blog
      # - href: games/index.qmd
      #   text: Games


    right:
      - text: "{{< iconify bi rss size=1.1em title='RSS' >}}"
        href: atom.xml
      - href: "mailto:a.vernet@ucl.ac.uk"
        icon: bi-envelope
      - text: '{{< fa brands bluesky size=sm >}}' 
        href: https://bsky.app/profile/antoinevernet.bsky.social
      - icon: youtube
        href: https://www.youtube.com/@antoinevernet
        rel: me
      - icon: github
        href: https://github.com/antoinevernet
      - icon: linkedin
        href: https://www.linkedin.com/in/antoine-vernet-6ba2462/
     
      
  page-footer:
    left: |
      <span class="faux-block">{{< fa copyright >}} {{< var years >}} Antoine Vernet</span>
      <span class="faux-block">Blog content licensed under<br>[{{< fa brands creative-commons >}} {{< fa brands creative-commons-by >}} Creative Commons CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)</span>
    center: |
      <span class="faux-block">{{< fa brands orcid >}} <strong>ORCID</strong> [{{< var orcid >}}](https://orcid.org/{{< var orcid >}})</span>
      <span class="faux-block">{{< ai google-scholar >}} [Google Scholar](https://scholar.google.com/citations?user=l2NNi8sAAAAJ)</span>
    right: |
      <span class="faux-block">Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)</span>
      <span class="faux-block">[View the source at {{< fa brands github >}} GitHub]({{< var github-url >}})</span>


format:
  html:
    theme:
      - html/custom.scss
    fontsize: 0.9em
    grid: 
      body-width: 900px
    toc: false
    icons: iconify
    # Quarto's author partial plus alt text on the ORCID badge. Repeated in
    # research/_metadata.yml and in the live-html post's own frontmatter.
    template-partials:
      - html/partials/_title-meta-author.html



