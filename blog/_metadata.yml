# Date format
date-format: "D MMMM, YYYY"

# Enable banner style title blocks
# title-block-banner: "#170C3A"
title-block-banner: "#003249"

# Blog-wide format options. These are set at the top level rather than
# under `format: html:` so that posts which need a different format
# (e.g. live-html for webR) don't also inherit html and render twice.
code-tools: true
# comments:
#   giscus: 
#     repo: 
#     category: Blog comments
#     category-id: 
#     mapping: pathname
quarto-template-params:
  banner-header-class: "blog-post"

# Default for table of contents
toc: true
toc-title: Contents
toc-location: left

freeze: auto

# Default knitr options
execute:
  echo: true
  message: true
  warning: true

# Default author
author:
  - name: Antoine Vernet
    url: https://antoinevernet.com/
    orcid: 0000-0002-7546-9829