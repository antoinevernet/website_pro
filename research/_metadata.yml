google-scholar: true
# Keep the citation: metadata for Scholar tags only, no "Cite as" appendix.
appendix-cite-as: false

# Enable banner style title blocks
title-block-banner: "#003249"

# Default for table of contents
toc: true
toc-title: Contents
toc-location: left

include-back-link: true

format:
  html:
    template-partials:
      - ../html/research/title-block.html
      - ../html/partials/_title-meta-author.html
    quarto-template-params:
      banner-header-class: "research"

# schema.org ScholarlyArticle/Chapter JSON-LD from the frontmatter
filters:
  - ../html/research/scholarly-jsonld.lua
